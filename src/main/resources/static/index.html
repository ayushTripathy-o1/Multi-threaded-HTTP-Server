<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Http Server</title>
        <style>
body{
    background:black;
    color:yellow;
    text-align:center;
}

div{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: xx-large;
    gap: 25px;
}
button{
    background-color: rgb(222, 225, 34);
    font-size: x-large;
    font-weight: bolder;
    cursor: pointer;
}
        </style>
    </head>
    <body>
        <div>
            Hello From Http Server !
            <br> 
            <button id="action">Click Here</button>
        </div>
        <script>

            function handelClick(){
                alert("It works")
            }

            const btn = document.getElementById('action')
            btn.addEventListener('click',handelClick)
        </script>
    </body>
</html>
